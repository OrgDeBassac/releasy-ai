name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.2'

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            ubuntu-latest) GOOS=linux ;;
            macos-latest) GOOS=darwin ;;
            windows-latest) GOOS=windows ;;
            *) echo "Unknown runner ${matrix.os}"; exit 1 ;;
          esac

          BIN_NAME="release-cli-${{ github.ref_name }}-${{ matrix.os }}"
          if [ "${GOOS}" = "windows" ]; then
            BIN_NAME="${BIN_NAME}.exe"
          fi

          mkdir -p out
          echo "Building ${BIN_NAME} (GOOS=${GOOS})"
          GOOS=${GOOS} GOARCH=$(go env GOARCH) go build -o out/${BIN_NAME} ./...
          ls -lh out

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.os }}-artifact
          path: out/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        run: |
          set -euo pipefail
          echo "Uploading files in artifacts/ to release ${UPLOAD_URL}"
          for f in $(find artifacts -type f); do
            name=$(basename "$f")
            echo "Uploading $name"
            # Upload via GitHub Releases upload_url
            curl -s --fail -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" "${UPLOAD_URL}?name=$name"
          done

